spring.application.name=bff-movil

server.port=8082

# Respuestas ligeras para dispositivos móviles
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=512

# Evita enviar propiedades nulas innecesarias
spring.jackson.default-property-inclusion=non_null

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks