# Puerto del microservicio
server.port=8092

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eft_cuentas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

# Resilience4j - Circuit Breaker para ms-clientes
resilience4j.circuitbreaker.instances.msClientes.slidingWindowSize=5
resilience4j.circuitbreaker.instances.msClientes.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.msClientes.failureRateThreshold=50
resilience4j.circuitbreaker.instances.msClientes.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.msClientes.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.msClientes.automaticTransitionFromOpenToHalfOpenEnabled=true

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-cuentas-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer