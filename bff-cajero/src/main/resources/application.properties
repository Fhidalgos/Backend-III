spring.application.name=bff-cajero

server.port=8083

# Respuestas pequeñas y eficientes para cajeros
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=256

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks