spring.application.name=batch-service

spring.datasource.url=jdbc:mysql://localhost:3306/eft_backend3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.batch.jdbc.initialize-schema=always

spring.batch.job.name=jobTransaccionesDiarias

batch.simular-error-temporal=false
